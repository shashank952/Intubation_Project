services:
  - type: web
    name: airway-api
    env: docker
    # Render's Docker runtime builds ./Dockerfile (repo root). The previous
    # ./backend/deploy/Dockerfile.api path required a Blueprint-created service;
    # a root Dockerfile lets `render services create` provision it directly.
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    plan: free
    autoDeploy: true
    envVars:
      - key: MONGO_URL
        sync: false
      - key: MONGO_DB
        value: airway_db
      - key: JWT_SECRET
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: LLM_API_URL
        value: https://openrouter.ai/api/v1
      - key: LLM_MODEL
        value: qwen/qwen-2.5-72b-instruct
      - key: MODEL_CHECKPOINT
        value: checkpoints/tabular_best.pt
      - key: MODEL_DEVICE
        value: cpu

# The frontend is hosted on Vercel (set NEXT_PUBLIC_API_URL there to this
# service's URL). The previous airway-frontend Render service was removed.
